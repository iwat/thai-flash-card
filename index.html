<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>บัตรคำ · Thai Sight Words</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --correct: #16a34a;
    --correct-press: #15803d;
    --wrong: #dc2626;
    --wrong-press: #b91c1c;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans Thai", "Sarabun", "Thonburi", "Leelawadee UI", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- top bar ---------- */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    font-size: 15px;
    color: var(--muted);
  }
  header .spacer { flex: 1 1 auto; }
  header button {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
  }
  header button:focus { outline: 2px solid var(--accent); }
  #stats { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #stats b { color: var(--text); }

  /* ---------- card ---------- */
  #card {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  #word {
    line-height: 1.05;
    text-align: center;
    white-space: nowrap;
    font-weight: 700;
    padding: 0 2vw;
    will-change: font-size;
  }
  #hint {
    position: absolute;
    bottom: 10px;
    left: 0; right: 0;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    opacity: .6;
  }

  /* ---------- answer buttons ---------- */
  #controls {
    flex: 0 0 auto;
    display: flex;
    gap: 14px;
    padding: 14px;
  }
  .btn {
    flex: 1 1 0;
    border: none;
    border-radius: 20px;
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(22px, 4.5vh, 40px);
    padding: 24px 10px;
    min-height: 14vh;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: transform .05s ease, filter .05s ease;
    touch-action: manipulation;
  }
  .btn small { font-size: .5em; font-weight: 600; opacity: .9; }
  .btn:active { transform: scale(.97); filter: brightness(1.1); }
  #wrong  { background: var(--wrong); }
  #wrong:active  { background: var(--wrong-press); }
  #correct { background: var(--correct); }
  #correct:active { background: var(--correct-press); }

  /* flash feedback */
  #card.flash-correct { animation: fc .35s ease; }
  #card.flash-wrong { animation: fw .35s ease; }
  @keyframes fc { 0% { background: rgba(22,163,74,.35);} 100% { background: transparent; } }
  @keyframes fw { 0% { background: rgba(220,38,38,.35);} 100% { background: transparent; } }

  /* ---------- session-complete overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay .sheet {
    background: var(--panel);
    border: 1px solid #334155;
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    max-width: 90vw;
  }
  #overlay .big { font-size: clamp(28px, 7vh, 54px); font-weight: 800; margin-bottom: 14px; }
  #overlay .sub { color: var(--muted); font-size: 18px; line-height: 1.6; margin-bottom: 24px; }
  #overlay .sub b { color: var(--text); }
  #overlay .go {
    font-family: inherit;
    font-weight: 700;
    font-size: 24px;
    color: #fff;
    background: var(--correct);
    border: none;
    border-radius: 18px;
    padding: 18px 40px;
    cursor: pointer;
  }
  #overlay .go:active { background: var(--correct-press); transform: scale(.97); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="stats"></span>
    <span class="spacer"></span>
    <button id="resetBtn" title="เริ่มใหม่ทั้งหมด">รีเซ็ต</button>
  </header>

  <div id="card" aria-live="polite">
    <div id="word">—</div>
    <div id="hint">แตะคำเพื่อข้าม · ← ผิด · → ถูก</div>
  </div>

  <div id="controls">
    <button id="wrong" class="btn">ผิด<small>Wrong</small></button>
    <button id="correct" class="btn">ถูก<small>Correct</small></button>
  </div>
</div>

<div id="overlay" class="hidden">
  <div class="sheet">
    <div class="big">เยี่ยมมาก! 🎉</div>
    <div id="sessionStat" class="sub"></div>
    <button id="continueBtn" class="go">ไปต่อ ›</button>
  </div>
</div>

<!-- Data and logic are loaded relative to this page (simple SPA). -->
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
